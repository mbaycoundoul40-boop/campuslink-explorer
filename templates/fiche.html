{{define "contenu"}}
<a href="/pays">← Retour au catalogue</a>
<h1>{{.Pays.Nom.Commun}}</h1>
<img src="{{.Pays.Drapeau.PNG}}" alt="Drapeau : {{.Pays.Nom.Commun}}" width="200">
<ul>
  <li>Capitale : {{range .Pays.Capitale}}{{.}} {{end}}</li>
  <li>Région : {{.Pays.Region}}</li>
  <li>Population : {{.Pays.Population}}</li>
  <li>Superficie : {{.Pays.Superficie}} km²</li>
</ul>
{{end}}
